name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: GOOS=darwin GOARCH=arm64 go build ./cmd/supremo
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/supremo
