name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run release tests
        run: go test -race ./...
      - name: Run debug tests
        run: go test -tags debug -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build release packages
        run: go build ./...
      - name: Build debug packages
        run: go build -tags debug ./...
      - name: Cross-compile macOS
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/supremo
      - name: Cross-compile Windows
        run: GOOS=windows GOARCH=amd64 go build ./cmd/supremo
